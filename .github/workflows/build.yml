name: build-deb
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  tweak:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          brew install ldid-stable || brew install ldid
          git config --global --add safe.directory '*'
      - name: Install theos (roothide fork, retry flaky SDK fetch)
        run: |
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          ok=0
          for i in 1 2 3 4; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"; then ok=1; break; fi
            echo "install attempt $i failed, retry in 20s"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "theos install failed after retries"; exit 1; }
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          find . -name '*.deb'
      - uses: actions/upload-artifact@v4
        with:
          name: bhtiktokpp-deb
          path: ${{ github.workspace }}/**/com.pwremilk.bhtiktokpp*.deb
